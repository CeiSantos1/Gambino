<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypt Engine</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg: #0d0d11;
            --card: #141419;
            --accent: #d4af37; 
            --text: #f4f4f5;
        }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        header { 
            padding: 20px; text-align: center; border-bottom: 1px solid #22222a; 
            background: linear-gradient(to bottom, #141419, var(--bg));
        }
        #status { font-size: 11px; color: var(--accent); margin-top: 4px; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; box-sizing: border-box; }
        .user { align-self: flex-end; background: #272732; color: #fff; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--card); border: 1px solid #22222a; border-bottom-left-radius: 4px; }
        .input-area { padding: 16px; display: flex; gap: 10px; border-top: 1px solid #22222a; background: var(--bg); }
        input { flex: 1; padding: 14px; background: #181822; border: 1px solid #333344; border-radius: 24px; color: #fff; font-size: 16px; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 22px; border-radius: 24px; font-weight: bold; font-size: 15px; }
        button:disabled, input:disabled { opacity: 0.4; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 18px; letter-spacing: 1px;">CORE ENGINE</div>
        <div id="status">Waiting to initialize...</div>
    </header>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="prompt-input" placeholder="Engine loading..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <script type="module">
        import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";

        const statusDiv = document.getElementById('status');
        const inputField = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        let generator = null;

        async function initAI() {
            try {
                statusDiv.innerText = "Downloading ultimate 3B brain to browser storage... (Approx 2.2GB)";
                
                // Pulls directly from Hugging Face natively to your iPhone 16e hardware via WebGPU
                generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-3B-Instruct', {
                    device: 'webgpu',
                    dtype: 'q4', 
                });

                statusDiv.innerText = "100% OFFLINE DISCONNECTED ENGINE ACTIVE";
                inputField.disabled = false;
                inputField.placeholder = "Ask anything without filters...";
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = "Hardware execution failed. Ensure WebGPU flags are active.";
                console.error(err);
            }
        }

        window.sendMessage = async function() {
            const text = inputField.value.trim();
            if(!text || !generator) return;

            appendMessage(text, 'user');
            inputField.value = '';
            statusDiv.innerText = "Thinking completely locally...";

            try {
                const output = await generator(text, { 
                    max_new_tokens: 400,
                    temperature: 0.7,
                    do_sample: true
                });
                
                const reply = output[0].generated_text;
                appendMessage(reply, 'ai');
            } catch (error) {
                appendMessage("Memory error. Close background tasks and try again.", 'ai');
            }
            statusDiv.innerText = "100% OFFLINE DISCONNECTED ENGINE ACTIVE";
        }

        function appendMessage(text, sender) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // Initialize on load
        initAI();
    </script>
</body>
</html>
