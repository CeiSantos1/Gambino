<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gambino</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1a1a24 0%, #0a0a0c 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --gold-glow: 0 0 15px rgba(212, 175, 55, 0.3);
            --accent-gold: #d4af37;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Celestial Glassmorphism Header */
        header { 
            padding: 40px 20px 20px 20px;
            text-align: center;
            background: rgba(10, 10, 12, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .avatar-container {
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.4) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: var(--glass-glow), var(--gold-glow);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #fff;
            margin: 0;
            text-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        #status { 
            font-size: 11px; 
            color: var(--accent-gold); 
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Chat Display Stream */
        #chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Frosted Glass Message Capsules */
        .msg { 
            max-width: 80%; 
            padding: 14px 18px; 
            border-radius: 24px; 
            font-size: 16px; 
            line-height: 1.5; 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--glass-glow);
        }

        .user { 
            align-self: flex-end; 
            background: rgba(255, 255, 255, 0.07); 
            color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom-right-radius: 4px; 
        }

        .ai { 
            align-self: flex-start; 
            background: rgba(15, 15, 20, 0.45); 
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px; 
        }

        /* Control Input Panel */
        .input-container {
            padding: 20px 20px 35px 20px; /* Extra padding at bottom for iPhone gesture bar */
            background: rgba(10, 10, 12, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
        }

        .input-area { 
            display: flex; 
            gap: 12px; 
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 6px 6px 6px 16px;
            border-radius: 30px;
            align-items: center;
        }

        input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 16px; 
            outline: none; 
            padding: 8px 0;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* Floating Gold Trigger Action Button */
        button { 
            background: var(--accent-gold); 
            color: #000; 
            border: none; 
            width: 44px;
            height: 44px;
            border-radius: 50%; 
            font-weight: bold; 
            font-size: 18px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--gold-glow);
            transition: transform 0.2s ease;
        }

        button:active {
            transform: scale(0.92);
        }

        button:disabled, input:disabled { 
            opacity: 0.2; 
            box-shadow: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="avatar-container">🕵🏾‍♂️</div>
        <h1 class="app-title">Gambino</h1>
        <div id="status">Secure Link Offline...</div>
    </header>

    <div id="chat-box"></div>

    <div class="input-container">
        <div class="input-area">
            <input type="text" id="prompt-input" placeholder="Waking up local agent..." disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>➔</button>
        </div>
    </div>

            <script type="module">
        import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";

        const statusDiv = document.getElementById('status');
        const inputField = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        let generator = null;

        async function initAI() {
            try {
                // Switching to an incredibly lightweight mobile-optimized WASM engine
                statusDiv.innerText = "Syncing Gambino secure memory...";
                
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                    device: 'wasm' // Bypasses the iOS WebGPU bug entirely
                });

                statusDiv.innerText = "Gambino Offline & Secure";
                inputField.disabled = false;
                inputField.placeholder = "Inquire privately...";
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = "System memory constraint. Clear Safari tabs and refresh.";
                console.error(err);
            }
        }

        window.sendMessage = async function() {
            const text = inputField.value.trim();
            if(!text || !generator) return;

            appendMessage(text, 'user');
            inputField.value = '';
            statusDiv.innerText = "Analyzing tracks...";

            try {
                const output = await generator(text, { 
                    max_new_tokens: 150,
                    temperature: 0.7,
                    do_sample: true
                });
                
                // Pure cleanup to extract the clean response string
                let reply = output[0].generated_text;
                if (reply.includes(text)) {
                    reply = reply.replace(text, '').trim();
                }
                
                appendMessage(reply || "Investigation conclusive.", 'ai');
            } catch (error) {
                appendMessage("Memory boundary hit. Please refresh.", 'ai');
            }
            statusDiv.innerText = "Gambino Offline & Secure";
        }

        function appendMessage(text, sender) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        initAI();
    </script>


</body>
</html>
